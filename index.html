<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hubby Games</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 300px;
        }

        button {
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <h1>Hubby Games</h1>

    <div class="games">

        <button onclick="launch('games/Cookie/index.html')">
            Cookie Clicker
        </button>

        <button onclick="launch('games/Hax.html')">
            Hax
        </button>

        <button onclick="launch('games/HollowKnight/index.html')">
            Hollow Knight
        </button>

        <button onclick="launch('games/Mine-1.8.8.html')">
            Minecraft 1.8.8
        </button>

        <button onclick="launch('games/Spelunky.html')">
            Spelunky
        </button>

        <button onclick="launch('games/WebRetro/index.html')">
            WebRetro
        </button>

    </div>


    <script>

        function launch(game) {

            const newTab = window.open("about:blank", "_blank");

            if (!newTab) {
                alert("Please allow popups for Hubby.");
                return;
            }

            newTab.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Hubby Game</title>

                    <style>
                        html, body {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background: black;
                        }

                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                        }
                    </style>
                </head>

                <body>
                    <iframe src="${game}"></iframe>
                </body>
                </html>
            `);

            newTab.document.close();
        }

    </script>

</body>
</html>
